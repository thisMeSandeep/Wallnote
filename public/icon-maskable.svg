<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable: platforms crop to a shape inside the middle 80%, so the
       backdrop bleeds to the full square and the acorn sits well inside the
       safe zone (a 205px-radius circle around centre). -->
  <rect width="512" height="512" fill="#2a2521"/>
  <circle cx="256" cy="256" r="150" fill="#c68f52" opacity="0.10"/>

  <!-- Acorn at ~55% of the canvas: translate(126,126) scale(10.83) -->
  <g transform="translate(126 126) scale(10.83)">
    <path d="M12 1.7v2" stroke="#5a3819" stroke-width="1.7" stroke-linecap="round" fill="none"/>
    <path d="M6.4 9.2c0 5.9 2.3 10.4 5.6 12.5 3.3-2.1 5.6-6.6 5.6-12.5z" fill="#c68f52"/>
    <path d="M8.7 10.8c-.1 3.5.6 6.4 1.8 8.2" stroke="#fff" stroke-opacity=".28"
          stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M4.5 8.6C4.5 5.2 7.8 3.2 12 3.2s7.5 2 7.5 5.4c0 .9-.3 1.3-1.2 1.4-1.9.3-4 .45-6.3.45s-4.4-.15-6.3-.45c-.9-.1-1.2-.5-1.2-1.4z" fill="#6b4522"/>
    <path d="M8.1 4.7L6.6 8.3M12 4v5.4M15.9 4.7l1.5 3.6" stroke="#a06a34" stroke-opacity=".5"
          stroke-width=".9" stroke-linecap="round" fill="none"/>
